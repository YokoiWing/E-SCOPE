[package]
autobins = false
autoexamples = false
autotests = false
autobenches = false
name = "mac_egg"
version = "0.1.0"
edition = "2024"

[features]
default = []
ilp-cbc = ["extraction_gym/ilp-cbc"]

[dependencies]
egraph-serialize = { version = "0.1.0", features = ["graphviz"] }
egg = { version = "0.10.0", features = ["serde-1"] }
extraction_gym = { path = "extraction_gym"}
indexmap = "2.10.0"
anyhow = "1.0.98"
rustc-hash = "1.1.0"
aiger = "0.2.0"
petgraph = "0.8.2"
nom = "8.0.0"
libertyparse = "0.3.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
derivative = "2.2.0"
itertools = "0.14.0"
ordered-float = "5.1.0"
ordered-float-3 = { package = "ordered-float", version = "3.9.2" }
regex = "1.11.2"
sha2 = "0.10.9"
