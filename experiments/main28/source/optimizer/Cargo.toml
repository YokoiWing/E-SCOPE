[package]
autobins = false
autoexamples = false
autotests = false
autobenches = false
name = "d1_series"
version = "0.1.0"
edition = "2024"
publish = false

[features]
milp-cbc = ["dep:coin_cbc"]

[dependencies]
anyhow = "1.0.98"
coin_cbc = { version = "0.1.6", optional = true }
egraph-serialize = { version = "0.1.0", features = ["graphviz"] }
egg = { version = "0.10.0", features = ["serde-1"] }
extraction_gym = { path = "../netlist/extraction" }
indexmap = "2.10.0"
mac_egg = { path = "../netlist" }
petgraph = "0.8.2"
regex = "1.11.2"
rustc-hash = "1.1.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"

[[bin]]
name = "run_generator_union_native"
path = "src/bin/iterative.rs"

[[bin]]
name = "run_frozen_a2_fast"
path = "src/bin/sizing.rs"

[[bin]]
name = "materialize_structural_macro_plan"
path = "src/bin/materialize.rs"

[[bin]]
name = "dump_mapped_nldm_v3_state"
path = "src/bin/timing_state.rs"
